name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch at a time. Pushing again cancels the older run instead of
# leaving it orphaned.
#
# ⚠️ Learned on 2026-08-19, and the second push was not the cause. A run for
# 476bcd5 sat "in progress" for over an hour while the newer run for the same
# branch finished in 3.3 minutes; it was wedged on `playwright install`, four
# steps before any test, holding a runner. Without this block GitHub keeps both
# alive, so the branch shows a permanently unfinished run next to a green one —
# and "unfinished" is the state hardest to read correctly, because it looks the
# same whether a job is working or dead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    # Ran in ~1m on 2026-08-19; 15 is generous headroom, not a target.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '11'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check report ↔ Stock Detail section parity
        # Fails if the downloadable report (ReportDocument.tsx) and the live
        # Stock Detail page render different section sets. See the script header.
        run: pnpm check:report-sections

      - name: Check paywall (entitlement) gates
        # Static tripwire for the F3 Step 10 paywall. Needs NO credentials, so —
        # unlike the behavioural e2e suite, which self-skips without secrets — it
        # can never go quiet. Fails if /api/cycle becomes public again, if it
        # re-advertises a shared cache (the CDN bypass that would defeat the whole
        # paywall), if a premium route loses its gate, or if the free-tier counter
        # columns become user-writable. See the script header.
        run: pnpm check:entitlement-gates

      - name: Check data-integrity rules
        # Two rules that no type checker can see, both from the 2026-08-05 data
        # audit: (a) never read a growing table without bounding the query —
        # PostgREST silently truncates at 1000 rows, and `stocks` grows on its
        # own as readers request tickers; (b) never label a financial-statement
        # figure with the SHARE PRICE currency — 79 of 858 stocks report in a
        # different one. Static scan, no credentials, so it can never go quiet.
        # It prints the number of checks it ran — read the count, not the colour.
        run: pnpm check:data-integrity

      - name: Check SEO plumbing
        # The static half of a pair (the other is e2e/seo.spec.ts, which reads the
        # real rendered HTML). Nothing here changes a pixel, so an SEO regression
        # cannot be seen by looking at the site, and every defect in the class is a
        # line that ISN'T there: a page with no canonical, a route missing from the
        # sitemap, a public path the middleware still bounces.
        #
        # It also enforces ONE canonical origin. That literal was in five files
        # before Layer G and one of them disagreed (apex vs www) — invisible because
        # NEXT_PUBLIC_SITE_URL is set in production, so the wrong fallback never
        # fired. `www` is load-bearing: the live Stripe webhook is registered on it
        # and Stripe counts a 3xx as a failed delivery.
        #
        # Prints the number of checks it ran — read the count, not the colour.
        run: pnpm check:seo

      - name: Build
        run: pnpm build

      # Reads the BUILD OUTPUT, so it has to follow the build. Asserts which
      # public pages are prerendered and — just as important — which must never
      # be. Both regressions are silent: a stray session read in the shared tree
      # un-statics the whole public site with nothing going red, and a page that
      # becomes static starts sending `s-maxage` where it used to send
      # `private, no-store` (CLAUDE.md 11a). Prints its own count.
      - name: Render modes (which pages are prerendered)
        run: pnpm check:render-modes

  e2e:
    name: E2E (Playwright — auth + Stripe webhook + entitlement)
    runs-on: ubuntu-latest
    # ⚠️ A hang here used to be INVISIBLE. GitHub's default is 6 hours, so the
    # wedged `playwright install` on 2026-08-19 produced no red, no email and no
    # notification — an unfinished run reads exactly like a slow one. The failed-
    # workflow email is the only alerting channel this project has, so a hang has
    # to become a FAILURE for anyone to hear about it. Whole suite runs in ~3.3m.
    timeout-minutes: 30
    # Boots a real Next dev server, so it needs the (public) Supabase URL + anon
    # key. They live as repo Variables — until they're set this job SKIPS cleanly
    # instead of failing, so CI never goes red on missing config. Add repo
    # Variables NEXT_PUBLIC_SUPABASE_URL + NEXT_PUBLIC_SUPABASE_ANON_KEY to enable.
    # (Optional: repo Secrets E2E_EMAIL + E2E_PASSWORD unlock the logged-in tests.)
    #
    # The Stripe webhook CONTRACT TESTS (e2e/stripe-webhook.spec.ts, plan §14) run in
    # this same job — they self-skip until their creds are present, so they never
    # block contributors. Enable them by adding repo Secrets STRIPE_TEST_SECRET_KEY +
    # STRIPE_TEST_WEBHOOK_SECRET + SUPABASE_SERVICE_ROLE_KEY. They sign events with the
    # test webhook secret, POST to /api/stripe/webhook, and assert the profiles row —
    # all in Stripe TEST mode, no network to Stripe, no real money.
    #
    # The PAYWALL BEHAVIOURAL MATRIX (e2e/entitlement-routes.spec.ts) also runs here. It
    # signs in as its own throwaway account and walks all seven subscription states
    # against real pages and the real API, then deletes the account. It needs only
    # SUPABASE_SERVICE_ROLE_KEY (already required above) and self-skips without it.
    # This is the only test that answers "is the paywall actually enforced end to end?"
    # — the static guard proves the wiring exists, this proves it works.
    if: ${{ vars.NEXT_PUBLIC_SUPABASE_URL != '' }}
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Stripe webhook contract tests (skip cleanly if any is empty):
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      # NOT a secret — a throwaway fixture value. e2e/entitlement-routes.spec.ts uses it
      # to prove /api/cycle's edge gate accepts a correct secret as well as rejecting a
      # missing one. The real production secret lives only in Vercel and is never needed
      # here: `next dev` computes the cycle by spawning cycle.py as a CLI, no HTTP.
      CYCLE_INTERNAL_SECRET: ci-throwaway-not-a-real-secret

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '11'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # ⚠️ NO `--with-deps`, and the reason is measured rather than assumed.
        # That flag runs `apt-get`, and on 2026-08-19 apt hung TWICE against
        # Ubuntu's mirrors — the log shows `Ign:` on azure.archive.ubuntu.com,
        # a fallback to archive.ubuntu.com, then 41 minutes of complete silence
        # before the run was killed. Four steps before any test ran.
        #
        # What it bought us, read off the one run that got through: every
        # Chromium shared library was already "the newest version" on the runner
        # image, and the ONLY 9 packages it installed were fonts —
        # fonts-ipafont-gothic, fonts-wqy-zenhei, xfonts-cyrillic and friends,
        # i.e. Japanese, Chinese, Thai and Cyrillic glyphs. This site is English
        # and ships its own webfonts (Sora + JetBrains Mono), so it renders no
        # script those fonts serve. The flag was ~2.5 of the step's 2.9 minutes,
        # all of the hang risk, and none of the benefit.
        #
        # If a genuine library ever does go missing from the image, Chromium
        # fails to launch and the suite goes RED with a clear message — a loud
        # failure, not a silent one, and re-adding the flag is a one-line undo.
        run: pnpm exec playwright install chromium

      # The E2E server is `next dev`, which computes a stock's cycle by SPAWNING
      # web/api/cycle.py as a CLI (lib/cycle.ts) rather than over HTTP. Without a Python
      # interpreter and these deps that spawn fails — and it fails SILENTLY, because
      # fetchCycleAnalysis degrades gracefully to null (lib/cycle.ts). The page still
      # renders 200 with every cycle section simply absent, which is exactly how it
      # presented: "Current Drawdown" never appearing for the free-viewer test.
      # Same class as the CYCLE_INTERNAL_SECRET blackout recorded in the roadmap — a
      # missing prerequisite that produces empty output instead of an error.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install engine Python deps (next dev spawns cycle.py)
        run: pip install -r requirements.txt

      # The offline report bundle is generated by `prebuild`, which only runs for
      # `pnpm build`. This job serves `next dev`, so public/report-bundle/ would
      # not exist and "Download Report" would fetch a 404 and never fire — which
      # is precisely why the downloaded report could be a blank page in
      # production for four days without one job going red (CLAUDE.md 11d).
      # e2e/report-download.spec.ts opens the real file, so it needs the real
      # bundle.
      - name: Build the offline report bundle (next dev does not)
        run: pnpm build:report-bundle

      - name: Run auth E2E
        run: pnpm e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  backend:
    name: Python checks
    runs-on: ubuntu-latest
    # Ran in ~1m on 2026-08-19 (pytest 153 in 11.5s); 15 is generous headroom.
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics/pyproject.toml

      - name: Install Python dependencies
        run: |
          pip install \
            "yfinance>=0.2.40" \
            "pandas>=2.2.0" \
            "numpy>=1.26.0" \
            "requests>=2.31.0" \
            "requests-cache>=1.2.0" \
            "supabase>=2.4.0" \
            "python-dotenv>=1.0.0" \
            "ruff>=0.4.0" \
            "mypy>=1.10.0" \
            "pandas-stubs>=2.2.0" \
            "pytest>=8.2.0" \
            "types-requests>=2.31.0"

      - name: Ruff lint
        run: |
          python -m ruff check analytics/
          # web/_engine/ uses `_engine.` imports, so ruff needs to know the
          # package root is web/. Lint from there with explicit paths.
          (cd web && python -m ruff check _engine/ api/)

      - name: Mypy type check
        run: |
          python -m mypy analytics/ --ignore-missing-imports --explicit-package-bases
          (cd web && python -m mypy _engine/ api/ --ignore-missing-imports --explicit-package-bases)

      - name: Pytest
        run: python -m pytest analytics/ -v

      - name: Check _engine drift from analytics
        run: |
          # Every file in web/_engine/ must match analytics/<same path>, modulo
          # the `from analytics.` → `from _engine.` import rewrite. If you edit
          # one without the other, this step fails.
          set -e
          fail=0
          # The list is DERIVED from what web/_engine/ actually contains, not
          # hardcoded. A hardcoded list has the same defect as everything else
          # this repo has been bitten by: adding a vendored file and forgetting
          # to add it to the list leaves it silently unguarded, and nothing goes
          # red. __init__.py files are the vendoring scaffolding itself and have
          # no analytics/ counterpart.
          files=$(cd web/_engine && find . -name '*.py' ! -name '__init__.py' \
                    | sed 's|^\./||' | sort)
          count=$(echo "$files" | grep -c . || true)
          echo "Comparing $count vendored file(s) against analytics/"
          if [ "$count" -lt 6 ]; then
            echo "Only $count files found in web/_engine/ — the scan is broken, not clean"
            exit 1
          fi
          for f in $files; do
            if [ ! -f "analytics/$f" ]; then
              echo "DRIFT: web/_engine/$f has no counterpart at analytics/$f"
              fail=1
              continue
            fi
            if ! diff -u \
                <(sed 's|from analytics\.|from _engine.|g' "analytics/$f") \
                "web/_engine/$f"; then
              echo "DRIFT: web/_engine/$f differs from analytics/$f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "The vendored cycle math in web/_engine/ is out of sync with"
            echo "the canonical files in analytics/. Update both in the same"
            echo "commit. See web/_engine/__init__.py for context."
            exit 1
          fi
