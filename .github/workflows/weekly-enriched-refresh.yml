name: Full Enriched Data Refresh

on:
  workflow_dispatch:         # manual trigger only — used when a forced full refresh is needed

# Read-only unless a job asks for more. The repository default is already read
# (checked 2026-09-25), but a default is someone else's setting; this file says it.
permissions:
  contents: read

jobs:
  refresh:
    name: Run full pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics/requirements-cron.txt

      # Pinned — see analytics/requirements-cron.txt. This workflow kept the old
      # unpinned floors for a day after the two daily refreshes were pinned,
      # which is the drift trap in CLAUDE.md 11c: a rule fixed in two places and
      # a third surface opting out by simply not being in either list. It matters
      # MORE here than in the daily jobs, not less — `--mode full` rewrites the
      # enriched data for every ticker, so an upstream units change lands on the
      # whole universe in one run.
      - name: Install analytics dependencies
        run: pip install -r analytics/requirements-cron.txt

      - name: Run full refresh
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m analytics.cron.daily_refresh --mode full
