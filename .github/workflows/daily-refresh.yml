name: Daily Data Refresh (US + CA)

# 22:30 UTC — after the NYSE/TSX 16:00 ET close in BOTH daylight regimes
# (20:00 UTC on EDT, 21:00 UTC on EST), with an hour's margin for the closing
# auction to print.
#
# Australia is NOT refreshed here; it has its own workflow at 08:00 UTC. There is
# no single time that works for all three: the ASX starts accepting next-day
# orders at 07:00 Sydney (20:00-21:00 UTC), which is before or exactly when New
# York closes. One run therefore always caught the ASX mid-session and stored a
# partial bar for a day that hadn't finished. See daily-refresh-au.yml.
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:        # allow manual trigger from Actions tab for testing

jobs:
  refresh:
    name: Run daily pipeline (US + CA)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics/requirements-cron.txt

      # PINNED, not floors. `yfinance>=0.2.40` meant this job installed whatever
      # was newest at 22:30 UTC — so an upstream release could change what our
      # numbers MEAN overnight, with no commit, no review and nothing red. That
      # is not hypothetical: yfinance changed `dividendYield` from a fraction to
      # a percent in a routine release, and the only trace is a comment in the
      # provider warning the next person not to multiply by 100.
      #
      # Upgrading is now a deliberate edit. After bumping, run
      # `python -m analytics.cron.check_field_units` and read what it prints.
      - name: Install analytics dependencies
        run: pip install -r analytics/requirements-cron.txt

      # Refresh the "Request a Ticker" menu from free public exchange symbol files
      # (no API key). continue-on-error so a flaky source never blocks the price
      # refresh below — the cached `listings` table stays usable.
      - name: Refresh ticker listings
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL:               ${{ secrets.OWNER_EMAIL }}
        run: python -m analytics.cron.refresh_listings

      # Refresh index membership (S&P 500 / ASX 200 / S&P/TSX 60) from official ETF
      # holdings files → `index_membership` table (read by the Run baskets, no
      # redeploy). Any new constituent we don't yet cover is fetched into the universe
      # directly here (audited in universe_log as added_by='index_membership' — NOT a
      # user request). continue-on-error so a flaky source never blocks the price refresh.
      - name: Refresh index membership
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL:               ${{ secrets.OWNER_EMAIL }}
        run: python -m analytics.cron.refresh_index_membership

      # Drain the user-requested-ticker queue (fetch each into the universe).
      - name: Drain ticker-request queue
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL:               ${{ secrets.OWNER_EMAIL }}
        run: python -m analytics.cron.drain_requests

      # US + CA only (their indices ride along: ^GSPC, ^IXIC, ^GSPTSE). ^AXJO is
      # refreshed with the AU equities so the benchmark and the stocks it is
      # compared against always come from the same completed session.
      - name: Run daily refresh (US + CA)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL:               ${{ secrets.OWNER_EMAIL }}
        run: python -m analytics.cron.daily_refresh --markets us,ca

      # Units tripwire. Compares each fundamentals field's cohort median against
      # the band declared beside its unit in providers/field_spec.py. A provider
      # changing a field from a fraction to a percent (yfinance has done this)
      # leaves every individual value looking perfectly ordinary and moves the
      # median by 100x — this is the only thing that sees it.
      #
      # continue-on-error: it runs AFTER the data is written, so its job is to
      # tell the owner something is wrong, not to fail a refresh that already
      # happened. The email is the signal; the red step would just be noise.
      - name: Check fundamentals field units
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL:               ${{ secrets.OWNER_EMAIL }}
        run: python -m analytics.cron.check_field_units --email
