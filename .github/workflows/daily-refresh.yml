name: Daily Data Refresh (US + CA)

# 01:30 UTC — after the NYSE/TSX 16:00 ET close in BOTH daylight regimes
# (20:00 UTC on EDT, 21:00 UTC on EST), with a wide margin for the closing auction
# to print AND for the provider to publish that session's daily bar.
#
# ⚠️ It was 22:30 UTC until 2026-09-05, and the change is a MEASUREMENT, not a
# preference (audit 5A-124). On 2026-09-04 this run stored Wednesday's bar for all
# 80 Canadian tickers and for ^GSPC and ^IXIC, and did NOT store it for 529 of 535
# US equities — every one of them a session behind its own benchmark. Both markets
# were fetched in the same interleaved window (US 00:23-00:55, CA 00:24-00:54), so
# it is not the run order, and the writer stores whatever the provider returns, so
# it is not ours. The likeliest remaining cause is that the provider had not yet
# finalised the US daily bars at ~00:30 UTC, which is what moving three hours later
# tests. **If the lag persists after this change, the timing theory is wrong and the
# next step is a targeted re-fetch of tickers behind their market — do not simply
# push the time later again.**
#
# The cost of the lag is bigger than a stale price: the ex-dividend bar arrives a
# day late too, so the full-history re-adjustment it triggers is also a day late.
# Five US stocks (HD, QCOM, BF-B, BR, PFG) were measured carrying 0.54-0.85% drift
# across their whole history for exactly that reason.
#
# Australia is NOT refreshed here; it has its own workflow at 08:00 UTC. There is
# no single time that works for all three: the ASX starts accepting next-day
# orders at 07:00 Sydney (20:00-21:00 UTC), which is before or exactly when New
# York closes. One run therefore always caught the ASX mid-session and stored a
# partial bar for a day that hadn't finished. See daily-refresh-au.yml.
on:
  schedule:
    - cron: '30 1 * * *'
  # Manual trigger from the Actions tab. The two inputs exist so the LISTINGS ALARM
  # can be proven end to end without waiting for a real outage and without touching
  # prices — the alarm's whole job is to fire on a day nobody is watching, so it has
  # to be exercisable on a day somebody is.
  #
  # ⚠️ Both defaults are the safe ones, and the polarity matters: a scheduled run
  # sends no inputs at all, so the guards below are written to RUN unless a manual
  # dispatch explicitly says otherwise. A guard that skipped work when an input was
  # absent would silently gut every nightly run.
  workflow_dispatch:
    inputs:
      run_prices:
        description: 'Run the full price refresh (leave ticked for a normal run)'
        type: boolean
        default: true
      asx_url_override:
        description: 'TESTING ONLY — point the ASX listings source somewhere else, to prove the alarm fires. Leave blank.'
        type: string
        default: ''

jobs:
  refresh:
    name: Run daily pipeline (US + CA)
    runs-on: ubuntu-latest
    # 90, not 60, since 2026-08-30. The refresh now runs its ticker loop a second
    # time over whatever failed, after a five-minute wait (see
    # daily_refresh._RETRY_PASS_DELAY), and the staleness sweep at the end reads
    # every ticker's newest bar. Neither is large — a typical night has 3 failures
    # in 620 — but the old ceiling had no measured headroom above it, and a job
    # that dies on `timeout-minutes` dies MID-WRITE, which is a worse outcome than
    # any it was protecting against. Actions minutes are unlimited on a public
    # repo, so the extra 30 costs nothing.
    timeout-minutes: 90
    # `contents: write` so the landing snapshot can be committed back. Nothing
    # else in this workflow writes to the repo.
    permissions:
      contents: write
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics/requirements-cron.txt

      # PINNED, not floors. `yfinance>=0.2.40` meant this job installed whatever
      # was newest at 22:30 UTC — so an upstream release could change what our
      # numbers MEAN overnight, with no commit, no review and nothing red. That
      # is not hypothetical: yfinance changed `dividendYield` from a fraction to
      # a percent in a routine release, and the only trace is a comment in the
      # provider warning the next person not to multiply by 100.
      #
      # Upgrading is now a deliberate edit. After bumping, run
      # `python -m analytics.cron.check_field_units` and read what it prints.
      - name: Install analytics dependencies
        run: pip install -r analytics/requirements-cron.txt

      # Refresh the "Request a Ticker" menu from free public exchange symbol files
      # (no API key). continue-on-error so a flaky source never blocks the price
      # refresh below — the cached `listings` table stays usable.
      - name: Refresh ticker listings
        id: listings
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Blank on every scheduled run. `sources.py` reads this with
          # `os.environ.get(k) or <default>` precisely so an empty value falls back
          # to the real URL instead of blanking it — `.get(k, default)` would hand
          # the fetcher an empty string and break the nightly job for everyone.
          ASX_LISTINGS_URL: ${{ inputs.asx_url_override }}
        run: python -m analytics.cron.refresh_listings

      # Refresh index membership (S&P 500 / ASX 200 / S&P/TSX 60) from official ETF
      # holdings files → `index_membership` table (read by the Run baskets, no
      # redeploy). Any new constituent we don't yet cover is fetched into the universe
      # directly here (audited in universe_log as added_by='index_membership' — NOT a
      # user request). continue-on-error so a flaky source never blocks the price refresh.
      - name: Refresh index membership
        if: github.event_name != 'workflow_dispatch' || inputs.run_prices
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m analytics.cron.refresh_index_membership

      # Drain the user-requested-ticker queue (fetch each into the universe).
      - name: Drain ticker-request queue
        if: github.event_name != 'workflow_dispatch' || inputs.run_prices
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m analytics.cron.drain_requests

      # US + CA only (their indices ride along: ^GSPC, ^IXIC, ^GSPTSE). ^AXJO is
      # refreshed with the AU equities so the benchmark and the stocks it is
      # compared against always come from the same completed session.
      - name: Run daily refresh (US + CA)
        if: github.event_name != 'workflow_dispatch' || inputs.run_prices
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m analytics.cron.daily_refresh --markets us,ca

      # Units tripwire. Compares each fundamentals field's cohort median against
      # the band declared beside its unit in providers/field_spec.py. A provider
      # changing a field from a fraction to a percent (yfinance has done this)
      # leaves every individual value looking perfectly ordinary and moves the
      # median by 100x — this is the only thing that sees it.
      #
      # ⚠️ This step is DELIBERATELY ALLOWED TO FAIL THE RUN (owner decision,
      # 2026-08-06). It carried `continue-on-error: true` until then, on the
      # reasoning that it runs AFTER the data is written so failing a refresh
      # that already happened would be noise, and the Resend email was the signal.
      #
      # That reasoning had a hole: it made SILENCE ambiguous. A green tick meant
      # "the data is fine", "the check found a problem but the email failed", and
      # "the step never ran" — three very different things that looked identical
      # from the outside. `_email()` swallows every exception by design, so a
      # broken send is invisible; and the alert had in fact NEVER been sent in the
      # project's life (verified against the full Resend history, 42 messages),
      # so the Resend path was an unproven single point of failure.
      #
      # Failing the run instead gives a signal we can SEE and have verified end to
      # end: GitHub's own "failed workflow" notification, which goes to the address
      # on the account (confirmed on screen: ayaatnibrasaziz@gmail.com) and is
      # already set to "Failed workflows only". It costs nothing — Actions minutes
      # are unlimited on a public repo — and it adds no mail on a good night, which
      # is what the owner asked for: no email unless something is actually wrong.
      #
      # It runs AFTER the refresh on purpose, so failing it cannot skip any work.
      # The data has already been written and is untouched by the red X — the red
      # means "tonight's numbers are suspect", not "the refresh didn't happen".
      # (It was the last step until 2026-08-25; the listings gate is now last, for
      # the same reason and with the same guarantee.)
      #
      # ⚠️ NO Resend email here, deliberately (owner decision, 2026-08-06). It used
      # to also send one via `--email`. Proven dead on 2026-08-06: both crons were
      # broken on purpose, both went red with the correct message, and Resend
      # recorded NOTHING. Cause — Resend holds exactly ONE api key, created
      # 2026-07-02, while the `RESEND_API_KEY` GitHub secret dates from 2026-05-24,
      # five weeks earlier. The secret holds a key that no longer exists.
      #
      # It failed SILENTLY because `_email()` calls `requests.post` and never looks
      # at the response: `requests` does not raise on 4xx, so a rejected send
      # returns normally, logs nothing, and is indistinguishable from a delivered
      # one. Two independent faults, and the design could not report either.
      #
      # GitHub's failed-workflow email is the single alert channel now — its
      # destination is visible (Settings > Notifications, ayaatnibrasaziz@gmail.com,
      # "Failed workflows only") rather than sealed inside a write-only secret.
      - name: Check fundamentals field units
        if: github.event_name != 'workflow_dispatch' || inputs.run_prices
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m analytics.cron.check_field_units

      # ── The landing page's live figures ────────────────────────────────────
      #
      # `/` states Apple's real current drawdown against its own historical
      # average. Those numbers are read from a committed JSON file, not queried
      # per visit, so the front door has no database in its critical path — which
      # means the file has to be regenerated and pushed here.
      #
      # It runs AFTER the refresh above, so it reads the bars this run just
      # stored rather than yesterday's.
      #
      # ⚠️ The script emits FREE-tier fields only, and that is structural rather
      # than remembered: it calls `calculate_cycle_metrics`, which cannot return a
      # rating, a health score or a valuation (CLAUDE.md 11b).
      # ⚠️ NO `--worked-example` here, and that flag's absence is load-bearing
      # (finding 5A-013, 2026-09-01). This step writes the two LIVE files:
      #
      #   universe-count.json  — how many companies we cover. A fact; never stale.
      #   learn-snapshot.json  — Apple's figures for the /learn explainers, which
      #                          describe how the product behaves TODAY (owner
      #                          decision: "keep the learn articles as is").
      #
      # It must NOT write `landing-snapshot.json`. Those same Apple figures do a
      # different job on the landing page: it writes prose ABOUT them and sits them
      # beside the FROZEN Mag 7 table. While this job rebuilt that file nightly the
      # two drifted apart, and the live page printed Apple at -11.3% in the table
      # and "8.0% below its high" three screens later. Regenerating a worked example
      # is a CONTENT change that needs the surrounding copy re-read, so it is done
      # by hand, both files together — never by a cron at 22:30 UTC.
      - name: Rebuild the live figures (count + /learn)
        if: github.event_name != 'workflow_dispatch' || inputs.run_prices
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m analytics.cron.build_landing_snapshot

      - name: Commit the live figures if they moved
        if: github.event_name != 'workflow_dispatch' || inputs.run_prices
        run: |
          set -e
          if git diff --quiet -- web/app/universe-count.json web/app/learn-snapshot.json; then
            echo "live figures unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ONLY these two files, named explicitly. `git commit -a` here would sweep
          # up anything else a future step leaves in the tree — and in particular it
          # must never pick up `landing-snapshot.json` or `mag7-snapshot.json`, the
          # two frozen worked examples this job is deliberately unable to write.
          git add web/app/universe-count.json web/app/learn-snapshot.json
          git commit -m "chore(landing): nightly live figures [skip ci]"
          git push

      # ── The listings alarm (audit F-027, 2026-08-25) ───────────────────────
      #
      # The AU listings source returned ZERO symbols every night from 2026-07-24
      # and nothing said so for a month. THREE silences were stacked, and removing
      # any two of them would have left it silent:
      #
      #   1. The ASX URL began answering HTTP 200 with an HTML rejection page, so
      #      nothing raised — the failure wore a success code. (Fixed at the source
      #      in analytics/listings/sources.py.)
      #   2. `refresh_listings` treats an empty pull as a soft failure, warning and
      #      carrying on. That is CORRECT — a bad night must never wipe a market's
      #      menu — but it is not a signal.
      #   3. And this: the step above runs `continue-on-error: true`, deliberately,
      #      so a flaky listings source can never block the nightly price refresh.
      #      Which means the script exiting non-zero is RECORDED AND IGNORED.
      #
      # ⚠️ So the script's exit code alone would have been a fix that changes
      # nothing anybody ever sees — the shape of defect this project keeps meeting.
      # This step is the half that is actually visible: it reads the recorded
      # outcome and fails the job, which fires GitHub's failed-workflow email — the
      # single alerting channel this project has, and the only one ever proven to
      # work (the Resend key has been dead since 2026-07-02).
      #
      # It is placed LAST, after the prices, the units check and the landing
      # snapshot, for exactly the reason the units check is last: failing here must
      # not skip any work. Everything above has already run and is untouched. A red
      # X here means "a market's menu is going stale", never "the refresh didn't
      # happen".
      #
      # `outcome` is the step's own result BEFORE continue-on-error rewrites it;
      # `conclusion` would always read success and this gate would never fire.
      # ── The staleness + delisting sweep (roadmap item 4, 2026-08-30) ───────
      #
      # A ticker the provider quietly stops serving is invisible: the refresh logs
      # it as failed and exits 0, the page keeps rendering, and the stored price
      # simply stops moving. Eleven companies were stale on 2026-08-30, one by four
      # months, and every night had reported success.
      #
      # This also applies the three-source delisting test and marks (never deletes)
      # anything all three agree has stopped trading. It runs LAST among the data
      # steps, after every write, so failing it can skip no work.
      #
      # `continue-on-error` + an id, so its result reaches the ONE gate below
      # rather than ending the job here. The owner's requirement was explicit: one
      # email when something is wrong, not one per problem.
      - name: Check for stale and delisted tickers
        id: staleness
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || inputs.run_prices
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m analytics.cron.check_stale_tickers

      # ── The ONE gate: one red X, one email, however many things went wrong ──
      #
      # GitHub sends a failed-workflow notification once per failed RUN, not per
      # failed step, so folding both alarms into a single gate is what keeps that
      # promise. Adding a second failing step would not have sent a second email —
      # but it would have made the run's status depend on which alarm fired first,
      # and the log would stop at the first one.
      #
      # ⚠️ `outcome` is each step's own result BEFORE `continue-on-error` rewrites
      # it. `conclusion` always reads success for those steps and this gate would
      # never fire — the exact trap that made audit F-027's first proposed fix a
      # no-op (see analytics/cron/refresh_listings.py).
      #
      # ⚠️ `always()` so this still runs when an earlier step already failed the
      # job. Without it, a hard failure above would skip the gate and the log would
      # never say which alarms were also ringing.
      - name: Fail the run if anything above needs attention
        if: always() && (steps.listings.outcome == 'failure' || steps.staleness.outcome == 'failure')
        run: |
          if [ "${{ steps.listings.outcome }}" = "failure" ]; then
            echo "::error::LISTINGS — the ticker listings refresh reported a problem."
            echo "::error::The site is still serving the previous menu — it was NOT"
            echo "::error::overwritten — but that menu is going stale and will not"
            echo "::error::repair itself. Read the 'Refresh ticker listings' step for"
            echo "::error::which market and how many symbols it pulled. A source"
            echo "::error::answering HTTP 200 with an error page is the known cause"
            echo "::error::(audit F-027)."
          fi
          if [ "${{ steps.staleness.outcome }}" = "failure" ]; then
            echo "::error::STALENESS — an unusual number of tickers stopped receiving"
            echo "::error::prices, or a delisting sweep was refused for safety. Read"
            echo "::error::the 'Check for stale and delisted tickers' step for the"
            echo "::error::market and the names. NOTE: a handful of chronically slow"
            echo "::error::tickers does NOT trigger this — it takes an outbreak, so"
            echo "::error::suspect tonight's run, the provider, or the network."
          fi
          exit 1
