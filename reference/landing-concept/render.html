<!doctype html><html><head><meta charset="utf-8"><title>film render</title>
<style>@font-face{font-family:'Sora';font-weight:300 800;src:url('fonts/sora-latin-v1.woff2') format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400 700;src:url('fonts/jetbrains-mono-latin-v1.woff2') format('woff2')}
html,body{margin:0;background:#0B1A36;overflow:hidden}#f svg{display:block;width:100vw;height:100vh}</style></head>
<body><div id="f"></div><script src="kit.js"></script><script src="film.js"></script><script>
HIDE_TEXT = new URLSearchParams(location.search).get('text') !== '1';
