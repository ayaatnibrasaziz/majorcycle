name: Daily Data Refresh (AU)

# 08:00 UTC — 18:00 Sydney on AEST, 19:00 on AEDT.
#
# Why Australia needs its own run. The ASX closing single-price auction finishes
# ~16:11 Sydney (05:11 UTC on AEDT, 06:11 UTC on AEST), but it starts accepting
# NEXT day's orders at 07:00 Sydney — 20:00-21:00 UTC. New York closes at
# 20:00-21:00 UTC. Those windows touch, so no single UTC time is after every
# market's close. The old combined 23:00 UTC run landed at 09:00-10:00 Sydney,
# i.e. mid pre-open, and stored a partial bar for a session that hadn't started:
# on 2026-08-04, 41 of 60 sampled AU tickers carried one.
#
# 08:00 UTC sits ~2h after the auction prints and ~12h before the next pre-open,
# so it can only ever see a completed session.
#
# This job deliberately does NOT run refresh_listings / refresh_index_membership /
# drain_requests — those stay in the US+CA workflow so they keep running exactly
# once a day, in their existing order.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:        # allow manual trigger from Actions tab for testing

jobs:
  refresh:
    name: Run daily pipeline (AU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics/requirements-cron.txt

      # Pinned — see analytics/requirements-cron.txt for why an unpinned data
      # pipeline is an unreviewed deploy every night.
      - name: Install analytics dependencies
        run: pip install -r analytics/requirements-cron.txt

      # AU equities + ^AXJO (indices follow their home country — see
      # daily_refresh._INDEX_HOME_MARKET).
      - name: Run daily refresh (AU)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL:               ${{ secrets.OWNER_EMAIL }}
        run: python -m analytics.cron.daily_refresh --markets au

      # The same units + invariants check the US+CA run does (owner decision,
      # 2026-08-06 — it was US+CA only until then).
      #
      # It is NOT redundant, and it is NOT "the AU half" of the check: this reads
      # the WHOLE 863-stock universe, exactly as the evening run does. Running it
      # here as well simply means a problem introduced by the morning write is
      # caught at 8am UTC instead of waiting ~14 hours for the 22:30 run. Cheap
      # (a single paginated read, seconds) and it halves the worst-case blind
      # window.
      #
      # ⚠️ NO `continue-on-error` — deliberate, same as the US+CA run. A green
      # tick must never be able to mean "a problem was found but you weren't
      # told". Failing the run is the signal: GitHub emails the account address
      # on a failed workflow, which is a destination we have SEEN, unlike the
      # Resend path whose recipient lives in a write-only secret and which had
      # never fired once in the project's life. Last step of the job, so failing
      # it skips no work and the AU data written above is untouched.
      #
      # ⚠️ No Resend email — the `RESEND_API_KEY` secret holds a key that no longer
      # exists in Resend, and `_email()` cannot detect a rejected send. Proven on
      # 2026-08-06; see the US+CA workflow for the full note. GitHub's
      # failed-workflow email is the only alert channel, and its destination is
      # visible rather than sealed in a write-only secret.
      - name: Check fundamentals field units
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m analytics.cron.check_field_units
